name: Security audit

# govulncheck reports known vulnerabilities in the code paths engram actually
# reaches, in both its dependencies and the Go standard library. It runs on
# every change and weekly, since a new advisory can affect unchanged code.

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 12 * * 1" # Mondays 12:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Pinned for a reproducible gate; the advisory database it queries is
      # always current.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
