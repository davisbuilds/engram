name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Title edits change the squash message and must rerun the required gate.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

# Cancel an in-flight run when a new commit is pushed to the same ref, so a busy
# PR does not queue redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    # Bounds a hung go test/lint step; a green run finishes in ~2-3 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: scripts/check-pr-title.sh

      - name: Test release history validation
        run: python3 -m unittest discover -s scripts -p 'test_release_history.py'

      - name: Validate main push and complete unreleased history
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/check_release_history.py "$BASE_SHA" "$HEAD_SHA"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # go.mod and go.sum must already be tidy, and downloaded modules must
      # match go.sum.
      - name: Go modules tidy and verified
        run: |
          go mod tidy -diff
          go mod verify

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Install golangci-lint
        # Fetch the installer from the v2.14.0 release commit (tags are mutable),
        # so the install script itself is pinned to the version it installs.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/114493f9b3e7257d29e4130f2b4a4aadefbb6845/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: golangci-lint run ./...

      - name: Format check (gofumpt via golangci-lint v2)
        run: |
          out=$(golangci-lint fmt --diff)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofumpt formatting differences found — run 'gofumpt -w .'"
            exit 1
          fi

      - name: Shell scripts (shellcheck + tests)
        run: |
          shellcheck scripts/*.sh
          scripts/semver-next_test.sh
          scripts/check-pr-title_test.sh
