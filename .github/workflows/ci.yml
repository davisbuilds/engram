name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel an in-flight run when a new commit is pushed to the same ref, so a busy
# PR does not queue redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-lint:
    runs-on: ubuntu-24.04
    # Bounds a hung go test/lint step; a green run finishes in ~2-3 min.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Install golangci-lint
        # Fetch the installer from the tagged release, not the mutable HEAD ref, so
        # the install script itself is pinned to the version it installs.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.13.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: golangci-lint run ./...

      - name: Format check (gofumpt via golangci-lint v2)
        run: |
          out=$(golangci-lint fmt --diff)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofumpt formatting differences found — run 'gofumpt -w .'"
            exit 1
          fi

      - name: Shell scripts (shellcheck + tests)
        run: |
          shellcheck scripts/*.sh
          scripts/semver-tag_test.sh
