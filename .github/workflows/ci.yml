name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test (race)
        run: go test -race ./...

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: golangci-lint run ./...

      - name: Format check (gofumpt via golangci-lint v2)
        run: |
          out=$(golangci-lint fmt --diff)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofumpt formatting differences found — run 'gofumpt -w .'"
            exit 1
          fi

      - name: Shell scripts (shellcheck + tests)
        run: |
          shellcheck scripts/*.sh
          scripts/semver-tag_test.sh
