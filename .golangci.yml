version: "2"

# WHY: the defaults already enable errcheck, govet, ineffassign, staticcheck,
# and unused, so only the extras are listed.
linters:
  enable:
    - misspell
    - unconvert
    - unparam
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
    errcheck:
      # WHY: Writes to stdout/stderr (help text, diagnostics, JSON envelopes) have
      # nothing useful to do with a returned error in a CLI; don't require it.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

formatters:
  enable:
    - gofumpt
